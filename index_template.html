<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIV_MANUAL_ARCHIVE | ManualKey Edition</title>
    <style>
        :root {
            --kz-orange: #ff4d00;
            --kz-bg: #0a0a0a;
            --kz-card: #141414;
            --kz-text: #f0f0f0;
            --kz-dim: #999;
            --kz-glow: rgba(255, 77, 0, 0.3);
        }
        * { box-sizing: border-box; }
        body { background-color: var(--kz-bg); color: var(--kz-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; line-height: 1.6; }
        header { border-bottom: 2px solid var(--kz-orange); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--kz-card); }
        .logo { font-family: 'Courier New', monospace; font-weight: 900; color: var(--kz-text); font-size: 1.5rem; text-decoration: none; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--kz-orange); }
        .search-box { display: flex; align-items: center; border-bottom: 1px solid var(--kz-orange); padding: 8px 0; width: 350px; }
        .search-box span { color: var(--kz-orange); font-weight: bold; margin-right: 10px; font-size: 0.8rem; }
        .search-box input { background: transparent; border: none; color: var(--kz-text); font-family: inherit; width: 100%; outline: none; }
        .filter-nav { background: var(--kz-bg); border-bottom: 1px solid #222; padding: 1rem 2rem; display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-btn { background: transparent; color: var(--kz-dim); border: 1px solid #333; padding: 6px 18px; cursor: pointer; font-family: inherit; font-size: 0.75rem; text-transform: uppercase; border-radius: 3px; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { border-color: var(--kz-orange); color: var(--kz-orange); box-shadow: 0 0 10px var(--kz-glow); }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
        .manual-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem; }
        .manual-card { background: var(--kz-card); border: 1px solid #222; padding: 2rem; display: flex; flex-direction: column; border-radius: 4px; transition: 0.3s ease; position: relative; }
        .manual-card:hover { border-color: var(--kz-orange); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); transform: translateY(-5px); }
        .manual-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--kz-orange); opacity: 0; transition: 0.3s; }
        .manual-card:hover::before { opacity: 1; }
        .cat-tag { font-size: 0.65rem; color: var(--kz-orange); margin-bottom: 0.75rem; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        h2 { font-size: 1.3rem; margin: 0 0 1rem 0; color: #fff; height: 3.2rem; overflow: hidden; }
        .card-description { color: var(--kz-dim); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-read { margin-top: auto; display: block; text-align: center; border: 1px solid var(--kz-orange); padding: 12px; text-decoration: none; color: var(--kz-orange); font-weight: bold; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; transition: 0.3s; }
        .btn-read:hover { background: var(--kz-orange); color: #000; }
        footer { margin-top: 5rem; padding: 3rem; font-size: 0.7rem; color: var(--kz-dim); text-align: center; border-top: 1px solid #222; background: var(--kz-card); }
        .creator-link { color: var(--kz-orange); text-decoration: none; margin-left: 10px; border: 1px solid var(--kz-orange); padding: 2px 8px; transition: 0.3s; }
        .creator-link:hover { background: var(--kz-orange); color: #000; }
        @media (max-width: 768px) { .search-box { width: 100%; margin-top: 15px; } header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <header>
        <a href="https://manualkey.org" class="logo">MANUAL<span>KEY</span></a>
        <div class="search-box">
            <span>QUERY:> </span>
            <input type="text" id="searchInput" placeholder="Search archive...">
        </div>
    </header>
    <nav class="filter-nav" id="filterNav"><!-- DYNAMIC_NAV --></nav>
    <div class="container">
        <div class="manual-grid" id="manualGrid"><!-- DYNAMIC_CARDS --></div>
    </div>
    <footer>
        <p>RESOURCES MANAGED BY @KEYZZILLA <a href="/keyzz.html" class="creator-link">[ MEET_THE_CREATOR ]</a></p>
        <p>MANUALKEY.ORG // SYSTEM_ARCHIVE</p>
    </footer>
    <script>
        const manualGrid = document.getElementById('manualGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function filter() {
            const term = searchInput.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').getAttribute('data-filter');
            const cards = document.querySelectorAll('.manual-card');

            cards.forEach(card => {
                const title = card.querySelector('h2').textContent.toLowerCase();
                const category = card.querySelector('.cat-tag').textContent;
                const matchesSearch = title.includes(term);
                const matchesFilter = activeFilter === 'all' || category.includes(activeFilter.toUpperCase());

                if (matchesSearch && matchesFilter) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        searchInput.addEventListener('keyup', filter);
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                filter();
            }
        });
    </script>
</body>
</html>
