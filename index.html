<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIV_MANUAL_ARCHIVE | ManualKey Edition</title>
    <style>
        :root {
            --kz-orange: #ff4d00;
            --kz-bg: #0a0a0a;
            --kz-card: #141414;
            --kz-text: #f0f0f0;
            --kz-dim: #999;
            --kz-glow: rgba(255, 77, 0, 0.3);
        }
        * { box-sizing: border-box; }
        body { background-color: var(--kz-bg); color: var(--kz-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; line-height: 1.6; }
        header { border-bottom: 2px solid var(--kz-orange); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--kz-card); }
        .logo { font-family: 'Courier New', monospace; font-weight: 900; color: var(--kz-text); font-size: 1.5rem; text-decoration: none; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--kz-orange); }
        .search-box { display: flex; align-items: center; border-bottom: 1px solid var(--kz-orange); padding: 8px 0; width: 350px; }
        .search-box text { color: var(--kz-orange); font-weight: bold; margin-right: 10px; font-size: 0.8rem; }
        .search-box input { background: transparent; border: none; color: var(--kz-text); font-family: inherit; width: 100%; outline: none; }
        .filter-nav { background: var(--kz-bg); border-bottom: 1px solid #222; padding: 1rem 2rem; display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-btn { background: transparent; color: var(--kz-dim); border: 1px solid #333; padding: 6px 18px; cursor: pointer; font-family: inherit; font-size: 0.75rem; text-transform: uppercase; border-radius: 3px; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { border-color: var(--kz-orange); color: var(--kz-orange); box-shadow: 0 0 10px var(--kz-glow); }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
        .manual-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem; }
        .manual-card { background: var(--kz-card); border: 1px solid #222; padding: 2rem; display: flex; flex-direction: column; border-radius: 4px; transition: 0.3s ease; position: relative; }
        .manual-card:hover { border-color: var(--kz-orange); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); transform: translateY(-5px); }
        .manual-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--kz-orange); opacity: 0; transition: 0.3s; }
        .manual-card:hover::before { opacity: 1; }
        .cat-tag { font-size: 0.65rem; color: var(--kz-orange); margin-bottom: 0.75rem; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        h2 { font-size: 1.3rem; margin: 0 0 1rem 0; color: #fff; height: 3.2rem; overflow: hidden; }
        .card-description { color: var(--kz-dim); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-read { margin-top: auto; display: block; text-align: center; border: 1px solid var(--kz-orange); padding: 12px; text-decoration: none; color: var(--kz-orange); font-weight: bold; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; transition: 0.3s; }
        .btn-read:hover { background: var(--kz-orange); color: #000; }
        footer { margin-top: 5rem; padding: 3rem; font-size: 0.7rem; color: var(--kz-dim); text-align: center; border-top: 1px solid #222; background: var(--kz-card); }
        .creator-link { color: var(--kz-orange); text-decoration: none; margin-left: 10px; border: 1px solid var(--kz-orange); padding: 2px 8px; transition: 0.3s; }
        .creator-link:hover { background: var(--kz-orange); color: #000; }
        @media (max-width: 768px) { .search-box { width: 100%; margin-top: 15px; } header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <header>
        <a href="https://manualkey.org" class="logo">MANUAL<span>KEY</span></a>
        <div class="search-box">
            <span>QUERY:> </span>
            <input type="text" id="searchInput" placeholder="Search archive...">
        </div>
    </header>
    <nav class="filter-nav" id="filterNav"><button class="filter-btn active" data-filter="all">ALL_FILES</button><button class="filter-btn" data-filter="Tech">TECH</button><button class="filter-btn" data-filter="Tools">TOOLS</button><button class="filter-btn" data-filter="Appliance">APPLIANCE</button><button class="filter-btn" data-filter="Kitchen">KITCHEN</button><button class="filter-btn" data-filter="Automotive">AUTOMOTIVE</button><button class="filter-btn" data-filter="Biotech">BIOTECH</button><button class="filter-btn" data-filter="Security">SECURITY</button><button class="filter-btn" data-filter="Garden">GARDEN</button><button class="filter-btn" data-filter="Audio">AUDIO</button><button class="filter-btn" data-filter="Office">OFFICE</button><button class="filter-btn" data-filter="Computers">COMPUTERS</button><button class="filter-btn" data-filter="Networking">NETWORKING</button><button class="filter-btn" data-filter="Photography">PHOTOGRAPHY</button><button class="filter-btn" data-filter="Video Games">VIDEO GAMES</button><button class="filter-btn" data-filter="Smartphones">SMARTPHONES</button><button class="filter-btn" data-filter="Drones">DRONES</button><button class="filter-btn" data-filter="Robotics">ROBOTICS</button><button class="filter-btn" data-filter="Furniture">FURNITURE</button><button class="filter-btn" data-filter="Lighting">LIGHTING</button><button class="filter-btn" data-filter="Plumbing">PLUMBING</button><button class="filter-btn" data-filter="Electrical">ELECTRICAL</button><button class="filter-btn" data-filter="HVAC">HVAC</button><button class="filter-btn" data-filter="Marine">MARINE</button><button class="filter-btn" data-filter="Aviation">AVIATION</button><button class="filter-btn" data-filter="Construction">CONSTRUCTION</button><button class="filter-btn" data-filter="Fitness">FITNESS</button><button class="filter-btn" data-filter="Camping">CAMPING</button><button class="filter-btn" data-filter="Fishing">FISHING</button><button class="filter-btn" data-filter="Hunting">HUNTING</button><button class="filter-btn" data-filter="Firearms">FIREARMS</button><button class="filter-btn" data-filter="Medical">MEDICAL</button><button class="filter-btn" data-filter="Laboratory">LABORATORY</button><button class="filter-btn" data-filter="Industrial">INDUSTRIAL</button><button class="filter-btn" data-filter="Agriculture">AGRICULTURE</button><button class="filter-btn" data-filter="Mining">MINING</button><button class="filter-btn" data-filter="Forestry">FORESTRY</button><button class="filter-btn" data-filter="Textile">TEXTILE</button><button class="filter-btn" data-filter="Printing">PRINTING</button><button class="filter-btn" data-filter="Packaging">PACKAGING</button><button class="filter-btn" data-filter="Electronics">ELECTRONICS</button><button class="filter-btn" data-filter="Semiconductors">SEMICONDUCTORS</button><button class="filter-btn" data-filter="Aerospace">AEROSPACE</button><button class="filter-btn" data-filter="Defense">DEFENSE</button><button class="filter-btn" data-filter="Space Tech">SPACE TECH</button><button class="filter-btn" data-filter="Renewable Energy">RENEWABLE ENERGY</button><button class="filter-btn" data-filter="Water Treatment">WATER TREATMENT</button><button class="filter-btn" data-filter="Waste Management">WASTE MANAGEMENT</button><button class="filter-btn" data-filter="Logistics">LOGISTICS</button><button class="filter-btn" data-filter="Retail Tech">RETAIL TECH</button><button class="filter-btn" data-filter="Home Cinema">HOME CINEMA</button></nav>
    <div class="container">
        <div class="manual-grid" id="manualGrid"></div>
    </div>
    <footer>
        <p>RESOURCES MANAGED BY @KEYZZILLA <a href="/keyzz.html" class="creator-link">[ MEET_THE_CREATOR ]</a></p>
        <p>MANUALKEY.ORG // SYSTEM_ARCHIVE</p>
    </footer>
    
    <script>
        (function() {
            const grid = document.getElementById('manualGrid');
            const searchInput = document.getElementById('searchInput');
            let manualData = [];
            let filteredData = [];

            // Add loading indicator
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--kz-orange); font-family: monospace; font-size: 1.2rem; background: var(--kz-card); border: 1px dashed var(--kz-orange);">[ INITIALIZING_ARCHIVE_DATABASE... ]<br><span style="font-size: 0.8rem; color: #666; margin-top: 10px; display: block;">Synchronizing 100,000+ technical records...</span></div>';

            // Load data asynchronously
            fetch('metadata.json')
                .then(response => response.json())
                .then(data => {
                    manualData = data;
                    filteredData = data;
                    filter();
                })
                .catch(err => {
                    console.error("ManualKey Error:", err);
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #ff0000;">[ ERROR: FAILED_TO_LOAD_DATABASE ]<br>' + err.message + '<br>' + (err.stack || '') + '</div>';
                });

            function renderGrid() {
                 try {
                    grid.innerHTML = '';
                    const fragment = document.createDocumentFragment();
                    const term = searchInput.value.toLowerCase();
                    const activeFilterObj = document.querySelector('.filter-btn.active');
                    const activeFilter = activeFilterObj ? activeFilterObj.getAttribute('data-filter') : 'all';
                    
                    const displayLimit = 500;
                    let matches = filteredData;
                    
                    for (let i = 0; i < Math.min(displayLimit, matches.length); i++) {
                        const item = matches[i];
                        if (!item || item.length < 3 || !item[2]) {
                            continue; // Skip corrupted rows silently
                        }
                        const [url, name, cat] = item;
                        
                        const card = document.createElement('div');
                        card.className = 'manual-card';
                        card.innerHTML = `
                            <div class="cat-tag">${cat.toUpperCase()}</div>
                            <h2>${name}</h2>
                            <p class="card-description">Manual for the ${name}.</p>
                            <a href="${url}" target="_blank" class="btn-read">ACCESS_INTERFACE</a>
                        `;
                        fragment.appendChild(card);
                    }
                    grid.appendChild(fragment);
                    
                    if (matches.length > displayLimit) {
                         const msg = document.createElement('div');
                         msg.style.gridColumn = '1/-1';
                         msg.style.textAlign = 'center';
                         msg.style.color = 'var(--kz-orange)';
                         msg.style.padding = '20px';
                         msg.textContent = `Showing first ${displayLimit} of ${matches.length} matching records. Refine search for specific files.`;
                         grid.appendChild(msg);
                    }
                 } catch (err) {
                     console.error("Render Grid Error:", err);
                     grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ff0000; padding: 50px;">[ ERROR: RENDER_FAULT ]<br>'+err.message+'</div>';
                 }
            }

            function filter() {
                try {
                    if (!manualData || manualData.length === 0) return;
                    
                    const term = searchInput.value.toLowerCase();
                    const activeFilterBtn = document.querySelector('.filter-btn.active');
                    const activeFilter = activeFilterBtn ? activeFilterBtn.getAttribute('data-filter') : 'all';
                    
                    filteredData = manualData.filter(item => {
                        if (!item || item.length < 3) return false;
                        const matchesSearch = item[1].toLowerCase().includes(term);
                        const matchesFilter = activeFilter === 'all' || item[2] === activeFilter;
                        return matchesSearch && matchesFilter;
                    });
                    renderGrid();
                } catch (err) {
                    console.error("Filter Error:", err);
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ff0000; padding: 50px;">[ ERROR: FILTER_FAULT ]<br>'+err.message+'</div>';
                }
            }

            searchInput.addEventListener('input', filter);
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    filter();
                }
            });

        })();
    </script>
</body>
</html>
